# ============================================================
# VOLUMES
# ============================================================

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  cassandra_data:
  minio_data:
  pgadmin_data:
  redisinsight_data:

# ============================================================
# NETWORK
# ============================================================

networks:
  marketplace_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16